# Dependabot configuration for the LANScape Python library (backend).
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates
#
# Covers three ecosystems in this repo:
#   1. pip            — backend Python deps declared in pyproject.toml
#   2. docker         — base images in docker/ Dockerfiles + compose services
#   3. github-actions — action versions pinned in .github/workflows/*
#
# NOTE: PRs target `main`. Titles use conventional-commit prefixes below
# (build(deps)/build(deps-dev)/build(docker)/ci(actions)). The Quality - PR
# Title check validates these for dependabot[bot]. They carry no leading
# X.Y.Z, so on merge the release pipeline detects the build()/ci() prefix and
# auto-increments the PATCH version to ship the bump (see
# release-trigger-main-push.yml).
version: 2

updates:
  # ── Backend: Python dependencies (pyproject.toml) ───────────────────────
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
    groups:
      # One PR/week for all non-breaking Python bumps (runtime + dev tooling).
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # Majors are kept OUT of the safe group above, but still consolidated
      # into a single PR (rather than one-per-dependency) so breaking changes
      # get deliberate review without flooding the PR list.
      python-major:
        patterns:
          - "*"
        update-types:
          - major

  # ── Docker: base images + compose service images ────────────────────────
  # Scans docker/Dockerfile, docker/Dockerfile.arm64, docker/Dockerfile.dev
  # and the docker/*compose*.yml files for tagged image updates.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(docker)"
    groups:
      docker-images:
        patterns:
          - "*"

  # ── CI: GitHub Actions used across workflows ────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(actions)"
    groups:
      github-actions:
        patterns:
          - "*"
